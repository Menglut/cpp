name: cppstudy-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cppstudy_session}
  SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-86400}
  SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-604800}

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      TRUST_PROXY: "true"
      MEDIA_ROOT: /app/uploads
    expose:
      - "3001"
    volumes:
      - app-uploads:/app/uploads
    networks:
      - edge
      - app-internal
    depends_on:
      app-db:
        condition: service_healthy
      app-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  app-worker:
    build:
      context: .
      dockerfile: apps/judge-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      EXECUTION_PROVIDER: judge0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      JUDGE0_URL: http://judge0-server:2358
      JUDGE0_AUTH_HEADER: ${JUDGE0_AUTH_HEADER:-X-Judge0-Token}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?JUDGE0_AUTH_TOKEN is required}
      JUDGE0_CPP17_LANGUAGE_ID: ${JUDGE0_CPP17_LANGUAGE_ID:-54}
      JUDGE0_COMPILER_VERSION: ${JUDGE0_COMPILER_VERSION:-C++ (GCC 9.2.0) via Judge0 CE 1.13.1}
      JUDGE0_REQUEST_TIMEOUT_MS: ${JUDGE0_REQUEST_TIMEOUT_MS:-10000}
      JUDGE0_EXECUTION_TIMEOUT_MS: ${JUDGE0_EXECUTION_TIMEOUT_MS:-30000}
      JUDGE0_POLL_INTERVAL_MS: ${JUDGE0_POLL_INTERVAL_MS:-500}
    networks:
      - app-internal
      - judge-internal
    depends_on:
      app-db:
        condition: service_healthy
      app-redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    logging: *default-logging

  app-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - app-postgres:/var/lib/postgresql/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  app-redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"',
      ]
    volumes:
      - app-redis:/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    env_file:
      - ${JUDGE0_CONFIG_FILE:-./deploy/judge0.conf}
    volumes:
      - ${JUDGE0_CONFIG_FILE:-./deploy/judge0.conf}:/judge0.conf:ro
    expose:
      - "2358"
    networks:
      - judge-internal
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "ruby",
          "-rnet/http",
          "-ruri",
          "-e",
          'uri=URI("http://127.0.0.1:2358/about"); request=Net::HTTP::Get.new(uri); request[ENV.fetch("AUTHN_HEADER")]=ENV.fetch("AUTHN_TOKEN"); response=Net::HTTP.start(uri.host, uri.port){|http| http.request(request)}; exit(response.is_a?(Net::HTTPSuccess) ? 0 : 1)',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true
    env_file:
      - ${JUDGE0_CONFIG_FILE:-./deploy/judge0.conf}
    volumes:
      - ${JUDGE0_CONFIG_FILE:-./deploy/judge0.conf}:/judge0.conf:ro
    networks:
      - judge-internal
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    logging: *default-logging

  judge0-db:
    image: postgres:16.2-alpine
    restart: unless-stopped
    env_file:
      - ${JUDGE0_CONFIG_FILE:-./deploy/judge0.conf}
    volumes:
      - judge0-postgres:/var/lib/postgresql/data
    networks:
      - judge-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  judge0-redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    env_file:
      - ${JUDGE0_CONFIG_FILE:-./deploy/judge0.conf}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly no --requirepass "$${REDIS_PASSWORD}"',
      ]
    networks:
      - judge-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["npm", "run", "prisma:deploy"]
    networks:
      - app-internal
    depends_on:
      app-db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["npm", "run", "prisma:seed"]
    networks:
      - app-internal
    depends_on:
      app-db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-CppStudy 관리자}
    command: ["npm", "run", "admin:create"]
    stdin_open: true
    tty: true
    networks:
      - app-internal
    depends_on:
      app-db:
        condition: service_healthy

networks:
  edge:
  app-internal:
    internal: true
  judge-internal:
    internal: true

volumes:
  app-postgres:
  app-redis:
  app-uploads:
  judge0-postgres:
  caddy-data:
  caddy-config:
