name: cppstudy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cppstudy}
      POSTGRES_USER: ${POSTGRES_USER:-cppstudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cppstudy_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cppstudy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cppstudy-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cppstudy-postgres:
  cppstudy-redis:
